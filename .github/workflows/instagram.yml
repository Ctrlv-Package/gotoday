name: Instagram accounts (hourly)

# Meta allows a limited number of account reads per hour. Reading a slice every hour — stalest accounts first —
# lets hundreds of town, library, parks and downtown accounts from Florida to Maine stay fresh through the day.
on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  instagram:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: set -o pipefail; npx tsx scripts/remote-ingest.ts 2>&1 | sed -E 's#(Bearer )[A-Za-z0-9._-]+#\1***#g' | tee ig.log
        env:
          GOTODAY_URL: ${{ secrets.GOTODAY_URL }}
          INGESTION_SECRET: ${{ secrets.INGESTION_SECRET }}
          MODE: instagram
          USE_BROWSER: "0"   # Instagram goes through the Meta API; no browser needed
      # The run's log, readable without the Actions page (branch "instagram-results", no deploy).
      - name: Save log
        if: always()
        run: |
          mkdir -p out && tail -n 400 ig.log > out/ig.log 2>/dev/null || echo "no log" > out/ig.log
          cd out && echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git init -q -b instagram-results && git config user.name ig && git config user.email ig@users.noreply.github.com
          git add -A && git commit -qm "instagram run $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" instagram-results
