name: Probe URLs (developer tool)
# Fetches a list of URLs from GitHub's servers and saves what came back to the "probe-results" branch,
# so new event sources can be inspected. Run by hand only.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs separated by spaces"
        required: true
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch
        env:
          URLS: ${{ inputs.urls }}
          SECRET: ${{ secrets.INGESTION_SECRET }}
        run: |
          mkdir out; i=0
          for u in $URLS; do
            i=$((i+1))
            AUTH=""; case "$u" in *mygotoday.com/api/admin/*) AUTH="Authorization: Bearer $SECRET";; esac
            curl -sSL -m 40 ${AUTH:+-H "$AUTH"} -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36" \
              -D "out/$i.headers" -o "out/$i.body" "$u" || echo "curl failed" > "out/$i.error"
            head -c 400000 "out/$i.body" > "out/$i.txt" 2>/dev/null; rm -f "out/$i.body"
            echo "$i $u" >> out/index.txt
          done
      - name: Save to probe-results branch
        run: |
          cd out
          git init -q -b probe-results
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git add -A; git commit -qm "probe $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-results
