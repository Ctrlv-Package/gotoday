name: Probe URLs (developer tool)
# Fetches a list of URLs from GitHub's servers and saves what came back to the "probe-results" branch,
# so new event sources can be inspected. Run by hand only.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs separated by spaces"
        required: true
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch
        env:
          URLS: ${{ inputs.urls }}
          SECRET: ${{ secrets.INGESTION_SECRET }}
        run: |
          mkdir out; i=0
          for u in $URLS; do
            i=$((i+1))
            AUTH=""; METHOD=GET
            case "$u" in POST:*) u="${u#POST:}"; METHOD=POST;; esac
            BODY=""; case "$u" in POSTIMG:*) u="${u#POSTIMG:}"; METHOD=POST; python3 -c "import zlib,struct;w,h=900,600;raw=b''.join(b'\\x00'+bytes([70,130,180])*w for _ in range(h));c=lambda t,d:struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d));open('t.png','wb').write(b'\\x89PNG\\r\\n\\x1a\\n'+c(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+c(b'IDAT',zlib.compress(raw))+c(b'IEND',b''))"; BODY="--data-binary @t.png -H content-type:image/png";; esac
            # POSTJSON:<base64 of a JSON body>@<url> — admin changes (e.g. fix one source's settings)
            case "$u" in POSTJSON:*) r="${u#POSTJSON:}"; echo "${r%%@*}" | base64 -d > body.json; u="${r#*@}"; METHOD=POST; BODY="--data-binary @body.json -H content-type:application/json";; esac
            case "$u" in *mygotoday.com/api/admin/*|*mygotoday.com/api/ingest*) AUTH="Authorization: Bearer $SECRET";; esac
            curl -sSL -X $METHOD -m 300 $BODY ${AUTH:+-H "$AUTH"} -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36" \
              -D "out/$i.headers" -o "out/$i.body" "$u" || echo "curl failed" > "out/$i.error"
            { head -c 400000 "out/$i.body" > "out/$i.txt" 2>/dev/null || true; }; rm -f "out/$i.body"
            echo "$i $u" >> out/index.txt
          done
      - name: Save to probe-results branch
        run: |
          cd out
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json   # results only: Vercel shouldn't try to build this branch
          git init -q -b probe-results
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git add -A; git commit -qm "probe $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-results
