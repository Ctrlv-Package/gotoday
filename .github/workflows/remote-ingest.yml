name: Remote ingest (city sites that block Vercel)

on:
  schedule:
    - cron: "20 10,16,22 * * *"   # ~6:20 AM, 12:20 PM, 6:20 PM Eastern (GitHub often starts scheduled runs late)
  workflow_dispatch: {}         # "Run workflow" button in the Actions tab

# One run at a time: a late scheduled run waits for a manual one instead of hitting Instagram twice at once.
concurrency:
  group: remote-ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: set -o pipefail; npx tsx scripts/remote-ingest.ts 2>&1 | tee ingest.log
        env:
          GOTODAY_URL: ${{ secrets.GOTODAY_URL }}
          INGESTION_SECRET: ${{ secrets.INGESTION_SECRET }}
          MODE: sites   # Instagram has its own hourly job (instagram.yml)
      # If the run fails, keep the end of its log on the probe-results branch so it can be read without the Actions UI.
      - name: Save log on failure
        if: failure()
        run: |
          mkdir out && tail -n 250 ingest.log | sed -E 's#(Bearer )[A-Za-z0-9._-]+#\1***#g' > out/ingest-failure.log || true
          cd out && echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git init -q -b probe-results && git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -A && git commit -qm "ingest failure log $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-results
