name: Remote ingest (city sites that block Vercel)

on:
  schedule:
    - cron: "20 10,16,22 * * *"   # ~6:20 AM, 12:20 PM, 6:20 PM Eastern (GitHub often starts scheduled runs late)
  workflow_dispatch: {}         # "Run workflow" button in the Actions tab

# One run at a time: a late scheduled run waits for a manual one instead of hitting Instagram twice at once.
concurrency:
  group: remote-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx tsx scripts/remote-ingest.ts
        env:
          GOTODAY_URL: ${{ secrets.GOTODAY_URL }}
          INGESTION_SECRET: ${{ secrets.INGESTION_SECRET }}
