name: Discover event sources

# Paste city / county / library website URLs; the job detects which calendar product each uses
# and prints ready-to-save GoToday source configs on the run page.
on:
  push:
    branches: [main]
    paths: ["discovery/candidates.txt"]   # editing the candidates list runs discovery and saves confirmed sources
  workflow_dispatch:
    inputs:
      urls:
        description: 'Optional extra sites, one per line. Optional city prefix: "Coral Springs, FL=https://www.coralsprings.gov"'
        required: false
        type: string
      save:
        description: "Save confirmed sources to GoToday"
        type: boolean
        default: true
      instagram_scan:
        description: "Only look for each site's Instagram account (also on sites that are already sources)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # On a push, check only the lines that push added (the file keeps growing state by state).
      - name: New candidate lines
        if: github.event_name == 'push'
        id: new
        run: |
          git diff "${{ github.event.before }}" HEAD -- discovery/candidates.txt 2>/dev/null | grep -E '^\+[^+]' | sed 's/^+//' > discovery/new.txt || git diff HEAD~1 -- discovery/candidates.txt | grep -E '^\+[^+]' | sed 's/^+//' > discovery/new.txt || true
          echo "count=$(grep -cE '^[^#].*https?://' discovery/new.txt || true)" >> "$GITHUB_OUTPUT"; cat discovery/new.txt
      - run: set -o pipefail; npx tsx scripts/discover-sources.ts 2>&1 | sed -E 's#(Bearer )[A-Za-z0-9._-]+#\1***#g' | tee discovery.log
        if: github.event_name != 'push' || steps.new.outputs.count != '0'
        env:
          DISCOVER_URLS: ${{ inputs.urls }}
          DISCOVER_FILE: ${{ github.event_name == 'push' && 'discovery/new.txt' || (inputs.urls == '' && 'discovery/candidates.txt' || '') }}
          USE_BROWSER: "1"
          SAVE: ${{ (github.event_name == 'push' || inputs.save) && '1' || '0' }}
          GOTODAY_URL: ${{ secrets.GOTODAY_URL }}
          INGESTION_SECRET: ${{ secrets.INGESTION_SECRET }}
          IG_SCAN: ${{ inputs.instagram_scan && '1' || '0' }}
      # The results table, readable without opening the Actions page (branch "discovery-results", no deploy).
      - name: Save results
        if: always()
        run: |
          mkdir -p out && cp discovery.log out/results.md 2>/dev/null || echo "no log" > out/results.md
          cp discovery/new.txt out/ 2>/dev/null || true
          cd out && echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git init -q -b discovery-results && git config user.name discovery && git config user.email discovery@users.noreply.github.com
          git add -A && git commit -qm "discovery results $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" discovery-results
